name: Deploy Rosemoon Apps Script

on:
  push:
    branches: [main]
    paths:
      - "Code.gs"
      - ".clasp.json"
      - ".github/workflows/apps-script-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          mkdir -p "$HOME"
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"

      - name: Push Code.gs to Apps Script
        run: clasp push --force

      - name: Update Apps Script deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub automatic deployment"
