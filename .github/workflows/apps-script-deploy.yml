name: Deploy Rosemoon Apps Script

on:
  push:
    branches: [main]
    paths:
      - "Code.gs"
      - ".clasp.json"
      - ".github/workflows/apps-script-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push Code.gs to Apps Script
        run: clasp push --force

      - name: Create Apps Script version
        id: version
        run: echo "version=$(clasp version "GitHub $GITHUB_SHA" | tail -n 1 | grep -oE '[0-9]+$')" >> "$GITHUB_OUTPUT"

      - name: Redeploy existing web app
        env:
          DEPLOYMENT_ID: AKfycbw3ovS6hIwHLhp50Xrs-6ejMxZkI_q-AhB-Mz6JXbsIRKSphJcMoqBELVY4nUogRR__
        run: clasp redeploy "$DEPLOYMENT_ID" "${{ steps.version.outputs.version }}" "GitHub automatic deployment"
