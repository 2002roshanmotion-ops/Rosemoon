<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoseMmoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style id="flowerPopupStyles">.flower-popup{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(40,18,28,.48);backdrop-filter:blur(8px)}.flower-popup.open{display:flex}.flower-popup-panel{width:min(1050px,calc(100vw - 16px));height:min(96vh,calc(100vh - 16px));max-height:calc(100vh - 16px);overflow-y:auto;overflow-x:hidden;box-sizing:border-box;background:#fff7fa;border:1px solid #ead5de;border-radius:22px;box-shadow:0 30px 80px rgba(40,18,28,.28);padding:18px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.flower-popup-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.flower-popup-kicker{font-size:11px;color:#a65c78;letter-spacing:.12em;font-weight:800;text-transform:uppercase}.flower-popup-title{margin:5px 0 4px;font:600 clamp(32px,5vw,48px) "Playfair Display";color:#3b202b}.flower-popup-sub{margin:0;color:#80636e}.flower-popup-close{border:1px solid #e6cad5;background:#fff;border-radius:999px;width:42px;height:42px;font-size:22px;color:#54333f;cursor:pointer}.flower-popup-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.flower-popup-card{background:#fff;border:1px solid #ead5de;border-radius:22px;padding:18px;box-shadow:0 12px 30px rgba(84,38,57,.07)}.flower-popup-art{height:105px;border-radius:18px;background:linear-gradient(145deg,#fff0f5,#ffe1eb);display:grid;place-items:center;font-size:86px;margin-bottom:14px}.flower-popup-card h3{font-size:14px;margin:0 0 3px;color:#3b202b}.flower-popup-price{font-weight:800;font-size:15px;color:#7e3e58;margin-bottom:8px}.flower-popup-stock{font-size:10px;font-weight:800;color:#3c8b62;margin-bottom:13px}.flower-popup-stock.low{color:#bd7a28}.flower-popup-stock.out{color:#c13b4b}.flower-popup-card button{width:100%;border:0;border-radius:10px;padding:8px 8px;background:#3b202b;color:#fff;font-weight:800;cursor:pointer}.flower-popup-card button:disabled{opacity:.6;cursor:not-allowed}.flower-popup-card{position:relative}.flower-popup-card button{position:relative;z-index:3}.flower-popup-card button.added{animation:flowerCartPop .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 0 4px rgba(126,62,88,.10)}@keyframes flowerCartPop{0%{transform:scale(1)}35%{transform:scale(1.06)}65%{transform:scale(.98)}100%{transform:scale(1)}}.flower-flyer{position:fixed;z-index:20000;pointer-events:none;font-size:58px;line-height:1;filter:drop-shadow(0 8px 12px rgba(59,32,43,.18));transform-origin:center;transition:transform .62s cubic-bezier(.2,.85,.25,1),opacity .62s ease}.flower-flyer::after{content:'✦';position:absolute;right:-14px;top:-10px;font-size:18px;animation:flowerSpark .85s ease forwards}.flower-spark{position:fixed;z-index:20001;pointer-events:none;font-size:16px;font-weight:900;animation:flowerSparkTrail .9s ease forwards;filter:drop-shadow(0 0 5px rgba(255,196,220,.9))}@keyframes flowerSparkTrail{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}18%{opacity:1}70%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(1) rotate(90deg)}100%{opacity:0;transform:translate(var(--dx2),var(--dy2)) scale(.2) rotate(180deg)}}.flower-cart-bounce{animation:flowerCartBounce .55s cubic-bezier(.2,.8,.2,1)}@keyframes flowerCartBounce{0%{transform:scale(1)}35%{transform:scale(1.18)}65%{transform:scale(.94)}100%{transform:scale(1)}}@keyframes flowerSpark{0%{opacity:0;transform:scale(.4) rotate(-20deg)}30%{opacity:1;transform:scale(1.1) rotate(10deg)}100%{opacity:0;transform:scale(.5) rotate(35deg) translate(8px,-8px)}}.flower-popup-note{margin-top:18px;padding:13px 16px;border-radius:14px;background:#fff0f5;color:#75515f;font-size:12px}@media(max-width:760px){.flower-popup{padding:10px}.flower-popup-panel{padding:20px;border-radius:22px}.flower-popup-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.flower-popup-art{height:120px;font-size:72px}.flower-popup-art img{width:100%;height:100%;object-fit:cover;display:block}}</style></head>
<body>
<div class="rosemoon-loader" id="rosemoonLoader" aria-live="polite">
  <div class="loader-petals" aria-hidden="true">
    <span>✿</span><span>❀</span><span>🌸</span><span>✧</span><span>🌷</span><span>♡</span><span>✿</span><span>🌸</span><span>✦</span><span>❀</span>
  </div>
  <div class="rosemoon-loader-orbit orbit-a" aria-hidden="true"></div>
  <div class="rosemoon-loader-orbit orbit-b" aria-hidden="true"></div>
  <div class="rosemoon-loader-card">
    <div class="loader-bloom loader-main-flower" aria-hidden="true"><img src="assets/main-flower.webp" alt="Rosemoon handmade flower bouquet"></div>
    <div class="rosemoon-loader-title"><img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3JYbYCHyy3naSeG6RhPtSZPxh49/ec2e63b0-a983-4186-a3da-ad6c75b1acf7.png" alt="RoseMmoon"></div>
    <div class="rosemoon-loader-subtitle">A little beauty is on its way</div>
    <div class="rosemoon-loader-track"><div class="rosemoon-loader-fill" id="rosemoonLoaderFill"></div><span class="rosemoon-loader-flower" aria-hidden="true">🌸</span></div>
    <div class="rosemoon-loader-meta"><span>LOADING</span><strong id="rosemoonLoaderPercent">0%</strong></div>
    <div class="loader-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</div>

<!-- FIRST PAGE: no welcome paragraph/text, only branding + START SHOPPING -->
<section class="landing-page" id="landingPage">
  <div class="landing-orbit orbit-1"></div>
  <div class="landing-orbit orbit-2"></div>
  <div class="landing-flowers" aria-hidden="true">
    <span>🌹</span><span>🌸</span><span>🌷</span><span>🌼</span><span>🌹</span><span>🌸</span>
  </div>
  <div class="landing-content">
    <div class="landing-logo"><img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3JYbYCHyy3naSeG6RhPtSZPxh49/ec2e63b0-a983-4186-a3da-ad6c75b1acf7.png" alt="RoseMmoon"></div>
    <div class="landing-mark">✿</div>
    <div class="landing-main-flower" aria-hidden="true"><img src="assets/main-flower.webp" alt=""></div>
    <button class="start-shopping" id="startShopping" type="button">
      <span>START SHOPPING</span><b>→</b>
    </button>
  </div>
</section>



<script>
(() => {
  const loader = document.getElementById("rosemoonLoader");
  const fill = document.getElementById("rosemoonLoaderFill");
  const percent = document.getElementById("rosemoonLoaderPercent");
  const start = document.getElementById("startShopping");
  let n = 0;

  // Start music preloading while the loading screen is visible.
  // Playback still requires the user's Start Shopping gesture.
  const ROSEMOON_API = "https://script.google.com/macros/s/AKfycbw3ovS6hIwHLhp50Xrs-6ejMxZkI_q-AhB-Mz6JXbsIRKSphJcMoqBELVY4nUogRR__/exec";
  (async()=>{
    try{
      const r=await fetch(ROSEMOON_API+"?action=music&_="+Date.now(),{cache:"no-store"});
      const d=await r.json();
      const first=(d.music||[]).filter(x=>x&&x.active!==false).sort((a,b)=>(Number(a.sort)||0)-(Number(b.sort)||0))[0];
      if(first?.url){
        const audio=document.createElement("audio");
        audio.preload="auto";
        audio.src=first.url;
        audio.load();
        audio.style.display="none";
        document.body.appendChild(audio);
      }
    }catch(e){}
  })();

  const timer = setInterval(() => {
    n = Math.min(100, n + 8);
    if (fill) fill.style.width = n + "%";
    if (percent) percent.textContent = n + "%";
    if (n >= 100) {
      clearInterval(timer);
      setTimeout(() => loader && loader.classList.add("done"), 180);
    }
  }, 45);

  if (start) {
    start.addEventListener("click", () => {
      window.location.href = "shop.html";
    });
  }
})();
</script>
</body>
</html>
